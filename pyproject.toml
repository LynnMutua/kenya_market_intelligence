description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gacheri-Mutua", email = "gacherimutua@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
